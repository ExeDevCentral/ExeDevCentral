<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <!-- Filtros de resplandor neón -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes Neón -->
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#fb7185" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="rowBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Chip Gradients -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Animación sutil de pulso / destello neón -->
    <style>
      .pulse-cyan {
        animation: pulseCyan 3s ease-in-out infinite alternate;
      }
      .pulse-purple {
        animation: pulsePurple 4s ease-in-out infinite alternate;
      }
      .pulse-rose {
        animation: pulseRose 3.5s ease-in-out infinite alternate;
      }
      @keyframes pulseCyan {
        0% { opacity: 0.4; }
        100% { opacity: 0.95; filter: drop-shadow(0 0 10px #00f0ff); }
      }
      @keyframes pulsePurple {
        0% { opacity: 0.3; }
        100% { opacity: 0.9; filter: drop-shadow(0 0 12px #a855f7); }
      }
      @keyframes pulseRose {
        0% { opacity: 0.3; }
        100% { opacity: 0.95; filter: drop-shadow(0 0 12px #fb7185); }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .chip-text {
        font-size: 11.5px;
        font-weight: 600;
        fill: #f1f5f9;
        letter-spacing: 0.2px;
      }
      .cat-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Aura atmosférica exterior detrás de la tarjeta -->
  <rect x="20" y="16" width="880" height="508" rx="20" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.15" filter="url(#neonGlowCyan)" />
  <rect x="20" y="16" width="880" height="508" rx="20" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.12" filter="url(#neonGlowPurple)" />

  <!-- Tarjeta Principal con Relieve de Borde Neón -->
  <rect x="20" y="16" width="880" height="508" rx="16" fill="url(#cardBgGrad)" stroke="url(#cardBorderGrad)" stroke-width="1.8" />

  <!-- Destellos en las 4 esquinas (Cyber Accents) -->
  <path d="M 28 38 L 28 24 L 42 24" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 892 38 L 892 24 L 878 24" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 502 L 28 516 L 42 516" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 892 502 L 892 516 L 878 516" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cabecera de la Tarjeta -->
  <g transform="translate(44, 40)">
    <circle cx="6" cy="6" r="4.5" fill="#00f0ff" class="pulse-cyan" />
    <text x="20" y="10" fill="#94a3b8" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.5">EXE.CORE // TECH STACK MULTI-REPO &amp; ARSENAL COMPLETO</text>

    <!-- Indicador de Status Neon -->
    <rect x="700" y="-3" width="132" height="20" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1" />
    <circle cx="712" cy="7" r="3" fill="#22c55e" />
    <text x="723" y="11" fill="#e2e8f0" class="mono" font-size="9" font-weight="700" letter-spacing="0.5">ACTIVE.ECOSYSTEM</text>
  </g>

  <!-- Línea divisoria superior -->
  <line x1="44" y1="68" x2="876" y2="68" stroke="url(#rowBorderGrad)" stroke-width="1" />

  <!-- ========================================================
